name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    name: macOS (AU, VST3)
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build
        run: cmake --build build --parallel 4

      - name: Test engine (render every instrument and drum kit)
        run: ./build/gm_render build/gm_tour.wav

      - name: Test plugin behaviour (synth layers, GM Player, combos, saved state)
        run: ./build/gemi_selftest build/selftest.wav build/_deps/fluidsynth-src/sf2/VintageDreamsWaves-v2.dls

      - name: Collect plugins
        run: |
          mkdir dist
          cp -R "build/GMSynth_artefacts/Release/AU" dist/
          cp -R "build/GMSynth_artefacts/Release/VST3" dist/

      - uses: actions/upload-artifact@v4
        with:
          name: gemi-macOS
          path: dist
